[project]
name = "quantfund"
version = "0.1.0"
description = "Multi-strategy stocks + options paper-trading platform (Alpaca paper) with an LLM multi-agent sleeve, capital allocator, risk circuit breakers, live dashboard, and walk-forward backtester"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33.0",
    "anthropic>=0.45.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
